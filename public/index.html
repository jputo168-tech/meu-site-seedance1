<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seedance Video 2.0 — Editor Independente</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: { bg: '#030303', card: '#0a0a0d', border: '#16161f' }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #030303;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 99px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 99px; }
  </style>
</head>
<body class="text-zinc-100 min-h-screen font-sans antialiased flex flex-col justify-between p-4 md:p-6 custom-scrollbar">

  <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-5 rounded-2xl bg-black border border-brand-border/80 backdrop-blur-md shadow-2xl gap-4 mb-6">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-violet-600 via-fuchsia-600 to-indigo-600 p-[1px] flex items-center justify-center shrink-0 shadow-lg">
        <div class="w-full h-full bg-brand-bg rounded-[11px] flex items-center justify-center">
          <svg class="w-6 h-6 text-violet-400 animate-pulse-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        </div>
      </div>
      <div>
        <h1 class="font-display text-xl md:text-2xl font-bold text-white flex items-center gap-1.5">
          Seedance Video <span class="text-violet-400 font-mono text-xs bg-violet-950/50 border border-violet-800/30 px-1.5 py-0.5 rounded">FAST</span>
        </h1>
        <p class="text-xs text-zinc-400 mt-0.5">Geração de vídeos assíncrona conectada ao OpenRouter</p>
      </div>
    </div>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start w-full max-w-7xl mx-auto flex-grow h-full mb-6">
    
    <section class="lg:col-span-4 bg-brand-card border border-brand-border p-5 rounded-2xl flex flex-col gap-6 shadow-xl h-full">
      <div class="pb-3 border-b border-white/5">
        <h2 class="text-sm font-bold font-display uppercase tracking-wider text-violet-400">Geração Avançada</h2>
      </div>

      <div id="panel-text" class="space-y-4">
        <div class="space-y-2">
          <label class="text-xs font-semibold text-zinc-300">A sua Chave do OpenRouter</label>
          <input type="password" id="api-key-input" class="w-full text-xs bg-black text-zinc-200 border border-white/5 rounded-xl p-3 outline-none focus:border-violet-500/60" placeholder="sk-or-v1-..." />
        </div>
        
        <div class="space-y-2">
          <label class="text-xs font-semibold text-zinc-300">Prompt Cinematográfico</label>
          <textarea id="prompt-input" rows="4" class="w-full text-xs bg-black text-zinc-200 border border-white/5 rounded-xl p-3 outline-none focus:border-violet-500/60" placeholder="Insira o seu comando aqui...">Um único lutador a executar uma sequência de combate intensa, sem duplas, câmara a afastar lentamente, atmosfera cinematográfica de ficção científica</textarea>
        </div>
      </div>

      <div class="space-y-4 pt-2 border-t border-white/5 mt-auto">
        <button id="generate-btn" onclick="startGenerationProcess()" class="w-full py-4 bg-gradient-to-r from-violet-600 via-fuchsia-600 to-indigo-600 text-white font-display font-bold text-xs rounded-xl shadow-lg uppercase cursor-pointer transition hover:scale-[1.02]">
          Gerar Vídeo IA
        </button>
      </div>
    </section>

    <section class="lg:col-span-8 flex flex-col gap-6 h-full">
      <div class="bg-brand-card border border-brand-border rounded-2xl overflow-hidden flex flex-col shadow-xl">
        <div class="p-4 bg-black/60 border-b border-white/5 flex items-center justify-between">
          <span class="text-xs font-mono text-zinc-300 uppercase">Monitor de Renderização</span>
        </div>

        <div class="relative bg-zinc-950 flex items-center justify-center p-4 min-h-[350px] md:min-h-[440px]">
          <div id="preview-empty-state" class="text-center max-w-sm space-y-4 p-6">
            <h3 class="text-sm font-bold text-white">Nenhum vídeo em reprodução</h3>
          </div>

          <div id="preview-loading-state" class="hidden w-full max-w-md text-center p-6 space-y-6">
            <h3 class="text-sm font-semibold text-white uppercase" id="loading-title">A criar o seu vídeo...</h3>
            <div class="w-full bg-zinc-900 h-2 rounded-full overflow-hidden">
              <div id="generation-progress-bar" class="bg-gradient-to-r from-violet-600 via-fuchsia-600 to-indigo-600 h-full w-0 transition-all duration-[5000ms]"></div>
            </div>
            <div class="flex justify-between font-mono text-[9px] text-zinc-500">
              <span id="load-label-console">A ligar ao OpenRouter...</span>
              <span id="load-percentage-console">0%</span>
            </div>
          </div>

          <div id="preview-player-state" class="hidden absolute inset-0 overflow-hidden flex items-center justify-center bg-black">
            <video id="player-mock-frame" class="w-full h-full object-contain" controls autoplay loop muted playsinline></video>
          </div>
        </div>
      </div>

      <div class="bg-brand-card border border-brand-border p-5 rounded-2xl flex flex-col gap-4 shadow-xl">
        <h3 class="text-sm font-bold text-white">Galeria de Criações</h3>
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 max-h-[300px] overflow-y-auto"></div>
      </div>
    </section>
  </main>

  <script>
    let isGenerating = false;

    async function startGenerationProcess() {
      if (isGenerating) return;
      
      const apiKey = document.getElementById('api-key-input').value.trim();
      const promptText = document.getElementById('prompt-input').value.trim();

      if (!apiKey) return alert("Por favor, introduza a sua chave do OpenRouter!");
      if (!promptText) return alert("Escreva um prompt!");

      isGenerating = true;
      document.getElementById('preview-empty-state').classList.add('hidden');
      document.getElementById('preview-player-state').classList.add('hidden');
      document.getElementById('preview-loading-state').classList.remove('hidden');

      let progress = 0;
      document.getElementById('generation-progress-bar').style.width = `10%`;
      document.getElementById('load-percentage-console').innerText = `10%`;
      document.getElementById('load-label-console').innerText = "A enviar pedido de vídeo para a API...";

      try {
        // Passo 1: Solicitar o vídeo à API especializada do OpenRouter
        const response = await fetch('https://openrouter.ai/api/v1/videos', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.href,
            'X-Title': 'Seedance Studio'
          },
          body: JSON.stringify({
            model: "bytedance/seedance-2.0-fast",
            prompt: promptText
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "O OpenRouter recusou o pedido (Erro " + response.status + ").");
        }

        const jobId = data.id;
        // Recebemos o endereço para efetuar as verificações do estado do ficheiro
        const pollingUrl = data.polling_url || `https://openrouter.ai/api/v1/videos/${jobId}`;

        document.getElementById('load-label-console').innerText = "Na fila de renderização (A verificar estado...)";
        document.getElementById('generation-progress-bar').style.width = `40%`;
        document.getElementById('load-percentage-console').innerText = `40%`;

        let videoUrl = null;
        let isCompleted = false;
        
        // Simular um progresso contínuo enquanto espera
        const progressInterval = setInterval(() => {
          if (progress < 90) progress += 2;
          document.getElementById('generation-progress-bar').style.width = `${progress}%`;
          document.getElementById('load-percentage-console').innerText = `${progress}%`;
        }, 3000);

        // Passo 2: Polling assíncrono (Perguntar à API se já terminou a cada 5 segundos)
        while (!isCompleted) {
          await new Promise(r => setTimeout(r, 5000));
          
          const pollResponse = await fetch(pollingUrl, {
            method: 'GET',
            headers: {
              'Authorization': `Bearer ${apiKey}`
            }
          });
          
          const pollData = await pollResponse.json();
          
          if (pollData.status === "completed") {
            isCompleted = true;
            if (pollData.unsigned_urls && pollData.unsigned_urls.length > 0) {
              videoUrl = pollData.unsigned_urls[0];
            } else if (pollData.content_url) {
              videoUrl = pollData.content_url;
            } else {
              videoUrl = `https://openrouter.ai/api/v1/videos/${jobId}/content`;
            }
          } else if (pollData.status === "failed") {
            clearInterval(progressInterval);
            throw new Error(pollData.error || "A geração falhou internamente no Seedance.");
          }
        }

        clearInterval(progressInterval);
        document.getElementById('generation-progress-bar').style.width = `100%`;
        document.getElementById('load-percentage-console').innerText = `100%`;
        document.getElementById('load-label-console').innerText = "Vídeo concluído!";

        setTimeout(() => {
          isGenerating = false;
          document.getElementById('preview-loading-state').classList.add('hidden');
          document.getElementById('preview-player-state').classList.remove('hidden');
          
          const player = document.getElementById('player-mock-frame');
          player.muted = true;
          player.src = videoUrl;
          player.play();

          const grid = document.getElementById('gallery-grid');
          grid.innerHTML = `<div class="bg-black p-2 border border-white/5 rounded-xl"><video src="${videoUrl}" controls loop muted class="w-full h-20 object-cover rounded-lg mb-1"></video><p class="text-[10px] truncate text-white">${promptText}</p></div>` + grid.innerHTML;
        }, 1000);

      } catch (error) {
        alert("Erro na IA: " + error.message);
        isGenerating = false;
        document.getElementById('preview-loading-state').classList.add('hidden');
        document.getElementById('preview-empty-state').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
