<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Vídeos IA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f13; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 1000px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .painel-controle, .painel-visualizacao { background: #1a1a24; padding: 20px; border-radius: 12px; border: 1px solid #2a2a3a; }
        h1, h2 { margin-bottom: 15px; color: #4f46e5; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        textarea, select, input { width: 100%; padding: 10px; background: #0f0f13; border: 1px solid #2a2a3a; border-radius: 6px; color: #fff; font-size: 14px; }
        textarea { resize: vertical; height: 100px; }
        button { width: 100%; padding: 12px; background: #4f46e5; border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #4338ca; }
        .monitor-video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px solid #2a2a3a; }
        .barra-progresso { position: absolute; bottom: 0; left: 0; height: 4px; background: #4f46e5; width: 0%; transition: width 0.3s; }
        .status-texto { position: absolute; font-size: 14px; color: #aaa; text-align: center; padding: 10px; }
        video { width: 100%; height: 100%; object-fit: contain; display: none; }
        .galeria { grid-column: 1 / -1; background: #1a1a24; padding: 20px; border-radius: 12px; border: 1px solid #2a2a3a; margin-top: 20px; }
        .grid-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .item-galeria { background: #0f0f13; border-radius: 8px; overflow: hidden; border: 1px solid #2a2a3a; }
        .item-galeria video { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .item-galeria p { padding: 8px; font-size: 12px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

<div style="max-width: 1000px; width: 100%;">
    <div class="container">
        <div class="painel-controle">
            <h2>Configurações</h2>
            <div class="campo">
                <label>Prompt do Vídeo</label>
                <textarea id="prompt" placeholder="Descreva o que você quer ver no vídeo..."></textarea>
            </div>
            <div class="campo">
                <label>Movimento de Câmera</label>
                <select id="motion">
                    <option value="zoom_in">Zoom In</option>
                    <option value="zoom_out">Zoom Out</option>
                    <option value="pan_left">Pan Esquerda</option>
                    <option value="pan_right">Pan Direita</option>
                    <option value="static">Estático</option>
                </select>
            </div>
            <div class="campo">
                <label>Duração (Segundos)</label>
                <select id="duration">
                    <option value="2">2 Segundos</option>
                    <option value="4">4 Segundos</option>
                </select>
            </div>
            <div class="campo">
                <label>Proporção (Aspect Ratio)</label>
                <select id="aspect">
                    <option value="16:9">16:9 (Horizontal)</option>
                    <option value="9:16">9:16 (Vertical)</option>
                </select>
            </div>
            <button id="btn-gerar" onclick="gerarVideo()">Gerar Vídeo</button>
        </div>

        <div class="painel-visualizacao">
            <h2>Resultado</h2>
            <div class="monitor-video">
                <video id="video-player" controls autoplay loop></video>
                <div id="status-render" class="status-texto">O seu vídeo renderizado aparecerá aqui.</div>
                <div id="progresso" class="barra-progresso"></div>
            </div>
        </div>
    </div>

    <div class="galeria">
        <h2>Minhas Criações</h2>
        <div id="grid-galeria" class="grid-galeria">
            </div>
    </div>
</div>

<script>
    async function gerarVideo() {
        const prompt = document.getElementById('prompt').value;
        const cameraMotion = document.getElementById('motion').value;
        const duration = document.getElementById('duration').value;
        const aspectRatio = document.getElementById('aspect').value;
        
        const btn = document.getElementById('btn-gerar');
        const videoPlayer = document.getElementById('video-player');
        const statusRender = document.getElementById('status-render');
        const barraProgresso = document.getElementById('progresso');

        if (!prompt) {
            alert('Por favor, digite um prompt!');
            return;
        }

        btn.disabled = true;
        btn.innerText = "Iniciando...";
        videoPlayer.style.display = 'none';
        statusRender.style.display = 'block';
        
        // Animação da barra de progresso simulando as etapas
        let progresso = 0;
        barraProgresso.style.width = '0%';
        
        const intervalo = setInterval(() => {
            if (progresso < 40) {
                progresso += 5;
                statusRender.innerText = `Processando prompts no Google AI Studio... (${progresso}%)`;
            } else if (progresso < 90) {
                progresso += 2;
                statusRender.innerText = `Renderizando vídeo no Seedance 2.0... (${progresso}%)`;
            }
            barraProgresso.style.width = `${progresso}%`;
        }, 150);

        try {
            const response = await fetch('/api/gerar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, cameraMotion, duration, aspectRatio })
            });

            const data = await response.json();
            clearInterval(intervalo);

            if (data.success && data.videoUrl) {
                barraProgresso.style.width = '100%';
                statusRender.style.display = 'none';
                
                // Configura e exibe o player de vídeo corrigido
                videoPlayer.src = data.videoUrl;
                videoPlayer.style.display = 'block';
                videoPlayer.play();

                // Adiciona o vídeo na galeria histórica
                adicionarNaGaleria(data.videoUrl, prompt);
            } else {
                throw new Error(data.error || 'Erro desconhecido');
            }
        } catch (error) {
            clearInterval(intervalo);
            barraProgresso.style.width = '0%';
            statusRender.innerText = `Erro: ${error.message}`;
            alert('Houve um problema ao processar seu vídeo.');
        } finally {
            btn.disabled = false;
            btn.innerText = "Gerar Vídeo";
        }
    }

    function adicionarNaGaleria(url, prompt) {
        const grid = document.getElementById('grid-galeria');
        const item = document.createElement('div');
        item.className = 'item-galeria';
        item.innerHTML = `
            <video src="${url}" controls loop muted></video>
            <p title="${prompt}">${prompt}</p>
        `;
        grid.prepend(item);
    }
</script>

</body>
</html>
